[build-system]
requires = ["setuptools>=64.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "marvis"
version = "0.1.0"
description = "MARVIS: Modality Adaptive Reasoning over VISualizations - Multi-modal classification using embeddings and VLMs for images, audio, and tabular data"
readme = "README.md"
authors = [
    {name = "Ben Feuer", email = "penfever@gmail.com"}
]
license = {text = "MIT"}
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.20.0,<2.3",
    "pandas>=1.3.0,<2.4",
    "torch>=2.0.0,<2.9",
    "transformers>=4.30.0,<4.60",
    "datasets>=2.10.0,<3.0",
    "tabpfn>=0.1.7,<3.0",
    "scikit-learn>=1.0.0,<1.8",
    "tqdm>=4.62.0,<5.0",
    "peft>=0.4.0,<1.0",
    "openml>=0.13.0,<0.16",
    "wandb>=0.15.0,<0.22",
    "matplotlib>=3.5.0,<3.9",
    "seaborn>=0.12.0,<0.14",
    "accelerate>=0.20.0,<1.0",
    "jsonschema>=4.0.0,<5.0",
    "jsonargparse>=4.0.0,<5.0",
    "PyYAML>=3.13,<7.0",
]

[project.optional-dependencies]
vision = [
    "torchvision>=0.15.0",
    "Pillow>=8.0.0",
    "timm>=0.9.0",
    # Additional vision dependencies that might be useful
    "opencv-python>=4.5.0",
    "albumentations>=1.3.0",
    "open-clip-torch>=2.20.0",  # For BioCLIP and other CLIP models
]

vlm = [
    # Vision Language Model dependencies
    "transformers>=4.45.0",
    "accelerate>=0.26.0",
    # Note: auto-gptq and bitsandbytes require CUDA, skip on Mac
    "optimum>=1.21.0",
]

vlm_cuda = [
    # CUDA-specific VLM dependencies (Linux/Windows with NVIDIA GPU)
    "auto-gptq>=0.7.0",
    "bitsandbytes>=0.43.0",
]

audio = [
    # Audio processing dependencies for audio classification
    "librosa>=0.9.2",
    "soundfile>=0.12.1",
    "openai-whisper>=20231117",
    "torchaudio>=0.13.0",
    "scipy>=1.9.0",
    # CLAP and transformers for audio-text models
    "transformers>=4.35.0",
    "datasets>=2.10.0",
    "msclap>=1.3.4",  # For CLAP zero-shot audio classification
    # Optional audio utilities
    "pydub>=0.25.1",
    # Note: audiomentations removed due to soxr build issues - not used in codebase
]

api = [
    # API clients for cloud-based models
    "openai>=1.15.0",              # Latest OpenAI API client for GPT-4.1 support
    "google-generativeai>=0.8.0",  # Latest Gemini API client for 2.5 models
    "httpx>=0.26.0",               # HTTP client for reliability
    "tenacity>=8.2.0",             # Retry logic for API calls
    "pydantic>=2.5.0",             # For structured API responses
]


llamacpp = [
    # LlamaCPP dependencies for GGUF quantized models
    "llama-cpp-python>=0.2.0",
    # Core dependencies already covered by main project
    # "numpy>=1.20.0", "pillow>=8.0.0" (covered by vision group)
]

docs = [
    # Documentation dependencies
    "sphinx>=6.0",
    "sphinx-rtd-theme>=1.3.0",
    "myst-parser>=0.18.0",
    "sphinx-autobuild>=2021.3.14",
]

dev = [
    # Development dependencies
    "pytest>=7.0.0,<9.0",
    "pytest-cov>=4.0.0,<6.0",
    "black>=23.0.0,<25.0",
    "ruff>=0.1.0,<1.0",
    "pre-commit>=3.0.0,<4.0",
    "mypy>=1.0.0,<2.0",
]

test = [
    # Testing framework and utilities
    "pytest>=7.0.0,<9.0",
    "pytest-cov>=4.0.0,<6.0",
    "pytest-xdist>=3.0.0,<4.0",        # Parallel test execution
    "pytest-timeout>=2.1.0,<3.0",      # Test timeout management
    "pytest-html>=3.2.0,<5.0",         # HTML test reports
    "pytest-benchmark>=4.0.0,<5.0",    # Performance benchmarks
    "pytest-mock>=3.10.0,<4.0",        # Mock utilities
    "pytest-asyncio>=0.21.0,<1.0",     # Async test support
    
    # Test data and utilities
    "Faker>=19.0.0,<30.0",               # Generate test data
    "factory-boy>=3.3.0,<4.0",          # Test object factories
    "responses>=0.23.0,<1.0",           # Mock HTTP responses
    "freezegun>=1.2.0,<2.0",            # Time mocking
    
    # Coverage and reporting
    "coverage>=7.0.0,<8.0",
    "codecov>=2.1.0,<3.0",
    
    # Security testing
    "bandit>=1.7.5,<2.0",
    "safety>=2.3.0,<4.0",
    "pip-audit>=2.6.0,<3.0",
    
    # Code quality
    "isort>=5.12.0,<6.0",
    "interrogate>=1.5.0,<2.0",          # Docstring coverage
]

[project.urls]
Homepage = "https://github.com/penfever/marvis"
Repository = "https://github.com/penfever/marvis"

[tool.setuptools]
packages = ["marvis", "marvis.data", "marvis.models", "marvis.models.vq", "marvis.train", "marvis.utils", "marvis.viz"]