name: End-to-End Tests

on:
  schedule:
    - cron: '0 4 * * 1'  # Weekly on Mondays at 4 AM UTC
  workflow_dispatch:
    inputs:
      test_scope:
        description: 'Scope of E2E tests'
        required: false
        default: 'quick'
        type: choice
        options:
        - quick
        - full
        - performance
      models:
        description: 'Models to test (comma-separated)'
        required: false
        default: 'Qwen/Qwen2.5-VL-3B-Instruct'
      datasets:
        description: 'Datasets to test (comma-separated)'
        required: false
        default: 'synthetic'

env:
  PYTHONUNBUFFERED: 1
  FORCE_COLOR: 1
  MARVIS_E2E_MODE: true

jobs:
  e2e-tabular-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python 3.10
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        cache: 'pip'
    
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg portaudio19-dev
    
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev,test,vision,audio]"
        pip install pytest-timeout pytest-html
    
    - name: Run E2E tabular tests
      run: |
        pytest tests/e2e/ \
          -v \
          --tb=short \
          --html=e2e-tabular-report.html \
          --self-contained-html \
          -m "e2e and tabular and not manual and not slow" \
          --maxfail=2 \
          --timeout=1800
      env:
        MARVIS_TEST_MODEL_SIZE: small
        MARVIS_TEST_MAX_SAMPLES: 20
        MARVIS_TEST_QUICK_MODE: true
    
    - name: Upload E2E tabular report
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: e2e-tabular-report
        path: e2e-tabular-report.html

  e2e-vision-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python 3.10
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        cache: 'pip'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev,test,vision]"
        pip install pytest-timeout pytest-html
    
    - name: Run E2E vision tests
      run: |
        pytest tests/e2e/ \
          -v \
          --tb=short \
          --html=e2e-vision-report.html \
          --self-contained-html \
          -m "e2e and vision and not manual and not slow" \
          --maxfail=2 \
          --timeout=1800
      env:
        MARVIS_TEST_MODEL_SIZE: small
        MARVIS_TEST_MAX_SAMPLES: 10
        MARVIS_TEST_QUICK_MODE: true
    
    - name: Upload E2E vision report
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: e2e-vision-report
        path: e2e-vision-report.html

  e2e-audio-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python 3.10
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        cache: 'pip'
    
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg portaudio19-dev
        python -m pip install --upgrade pip
        pip install -e ".[dev,test,audio]"
        pip install pytest-timeout pytest-html
    
    - name: Run E2E audio tests
      run: |
        pytest tests/e2e/ \
          -v \
          --tb=short \
          --html=e2e-audio-report.html \
          --self-contained-html \
          -m "e2e and audio and not manual and not slow" \
          --maxfail=2 \
          --timeout=1800
      env:
        MARVIS_TEST_MODEL_SIZE: small
        MARVIS_TEST_MAX_SAMPLES: 5
        MARVIS_TEST_QUICK_MODE: true
    
    - name: Upload E2E audio report
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: e2e-audio-report
        path: e2e-audio-report.html

  e2e-api-tests:
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.test_scope == 'full' || github.event_name == 'schedule' }}
    timeout-minutes: 240
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python 3.10
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        cache: 'pip'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev,test,api]"
        pip install pytest-timeout pytest-html
    
    - name: Run E2E API tests
      run: |
        pytest tests/e2e/ \
          -v \
          --tb=short \
          --html=e2e-api-report.html \
          --self-contained-html \
          -m "e2e and api and not manual" \
          --maxfail=1 \
          --timeout=2400
      env:
        # API keys would be set as repository secrets
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        MARVIS_TEST_QUICK_MODE: true
        MARVIS_TEST_MAX_SAMPLES: 5
    
    - name: Upload E2E API report
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: e2e-api-report
        path: e2e-api-report.html

  e2e-performance-tests:
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.test_scope == 'performance' }}
    timeout-minutes: 300
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python 3.10
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        cache: 'pip'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev,test,vision,audio]"
        pip install pytest-benchmark pytest-timeout pytest-html
    
    - name: Run E2E performance tests
      run: |
        pytest tests/e2e/ \
          -v \
          --tb=short \
          --html=e2e-performance-report.html \
          --self-contained-html \
          -m "e2e and benchmark" \
          --benchmark-only \
          --benchmark-json=e2e-benchmark.json \
          --timeout=3600
      env:
        MARVIS_PERFORMANCE_MODE: true
        MARVIS_TEST_MODEL_SIZE: medium
    
    - name: Upload performance results
      uses: actions/upload-artifact@v3
      with:
        name: e2e-performance-results
        path: |
          e2e-performance-report.html
          e2e-benchmark.json

  e2e-multi-backend-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    
    strategy:
      matrix:
        backend: [transformers, llamacpp]
        include:
          - backend: transformers
            install_extra: "vision,audio"
            env_vars: "VLLM_AVAILABLE=false"
          - backend: llamacpp
            install_extra: "llamacpp"
            env_vars: "VLLM_AVAILABLE=false,MARVIS_FORCE_BACKEND=llamacpp"
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python 3.10
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        cache: 'pip'
    
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg portaudio19-dev
    
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev,test,${{ matrix.install_extra }}]"
        pip install pytest-timeout pytest-html
    
    - name: Install LlamaCPP (if needed)
      if: matrix.backend == 'llamacpp'
      run: |
        pip install llama-cpp-python
    
    - name: Run E2E backend-specific tests
      run: |
        pytest tests/e2e/ \
          -v \
          --tb=short \
          --html=e2e-${{ matrix.backend }}-report.html \
          --self-contained-html \
          -m "e2e and ${{ matrix.backend }} and not manual" \
          --maxfail=2 \
          --timeout=2400
      env: |
        ${{ matrix.env_vars }}
        MARVIS_TEST_QUICK_MODE=true
        MARVIS_TEST_MAX_SAMPLES=10
    
    - name: Upload backend test report
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: e2e-${{ matrix.backend }}-report
        path: e2e-${{ matrix.backend }}-report.html

  e2e-integration-workflow:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python 3.10
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        cache: 'pip'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev,test,vision,audio]"
        pip install pytest-timeout pytest-html
    
    - name: Run complete workflow tests
      run: |
        pytest tests/e2e/ \
          -v \
          --tb=short \
          --html=e2e-workflow-report.html \
          --self-contained-html \
          -m "e2e and workflow and not manual" \
          --maxfail=1 \
          --timeout=1800
      env:
        MARVIS_TEST_COMPLETE_WORKFLOW: true
        MARVIS_TEST_MODEL_SIZE: small
        MARVIS_TEST_MAX_SAMPLES: 15
    
    - name: Upload workflow test report
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: e2e-workflow-report
        path: e2e-workflow-report.html

  e2e-test-summary:
    runs-on: ubuntu-latest
    needs: [e2e-tabular-tests, e2e-vision-tests, e2e-audio-tests, e2e-multi-backend-tests, e2e-integration-workflow]
    if: always()
    
    steps:
    - name: E2E Test Summary
      run: |
        echo "## End-to-End Test Results Summary" >> $GITHUB_STEP_SUMMARY
        echo "| Test Suite | Status |" >> $GITHUB_STEP_SUMMARY
        echo "|------------|--------|" >> $GITHUB_STEP_SUMMARY
        echo "| Tabular E2E Tests | ${{ needs.e2e-tabular-tests.result }} |" >> $GITHUB_STEP_SUMMARY
        echo "| Vision E2E Tests | ${{ needs.e2e-vision-tests.result }} |" >> $GITHUB_STEP_SUMMARY
        echo "| Audio E2E Tests | ${{ needs.e2e-audio-tests.result }} |" >> $GITHUB_STEP_SUMMARY
        echo "| Multi-Backend Tests | ${{ needs.e2e-multi-backend-tests.result }} |" >> $GITHUB_STEP_SUMMARY
        echo "| Integration Workflow | ${{ needs.e2e-integration-workflow.result }} |" >> $GITHUB_STEP_SUMMARY
        
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### Test Configuration" >> $GITHUB_STEP_SUMMARY
        echo "- Test Scope: ${{ github.event.inputs.test_scope || 'quick' }}" >> $GITHUB_STEP_SUMMARY
        echo "- Models: ${{ github.event.inputs.models || 'Qwen/Qwen2.5-VL-3B-Instruct' }}" >> $GITHUB_STEP_SUMMARY
        echo "- Datasets: ${{ github.event.inputs.datasets || 'synthetic' }}" >> $GITHUB_STEP_SUMMARY
        
        # Generate overall status
        FAILED_TESTS=0
        [[ "${{ needs.e2e-tabular-tests.result }}" == "failure" ]] && ((FAILED_TESTS++))
        [[ "${{ needs.e2e-vision-tests.result }}" == "failure" ]] && ((FAILED_TESTS++))
        [[ "${{ needs.e2e-audio-tests.result }}" == "failure" ]] && ((FAILED_TESTS++))
        [[ "${{ needs.e2e-multi-backend-tests.result }}" == "failure" ]] && ((FAILED_TESTS++))
        [[ "${{ needs.e2e-integration-workflow.result }}" == "failure" ]] && ((FAILED_TESTS++))
        
        echo "" >> $GITHUB_STEP_SUMMARY
        if [ $FAILED_TESTS -eq 0 ]; then
          echo "🎉 All E2E tests passed!" >> $GITHUB_STEP_SUMMARY
        else
          echo "⚠️ $FAILED_TESTS E2E test suite(s) failed" >> $GITHUB_STEP_SUMMARY
          exit 1
        fi